<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>FRACTURE — Lampwrecked</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;display:block;touch-action:none;cursor:none}
/* nothing is ever written on screen. the readout + tuning buttons only appear after 5 quick taps in the bottom-left corner (or ?debug=1) */
#dbg{position:fixed;left:12px;top:10px;font:max(14px,1.7vmin)/1.35 ui-monospace,Menlo,Consolas,monospace;color:#9f9;background:rgba(0,0,0,.7);padding:6px 9px;pointer-events:none;display:none;white-space:pre}
#pan{position:fixed;left:20vmin;bottom:12px;display:none;flex-wrap:wrap;gap:8px;max-width:calc(96vw - 20vmin)}
#pan button{font:max(14px,1.9vmin)/1 ui-monospace,Menlo,Consolas,monospace;color:#9f9;background:rgba(0,0,0,.8);border:1px solid #9f9;padding:1.3vmin 1.6vmin;border-radius:0}
body.tune #dbg{display:block}body.tune #pan{display:flex}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="dbg"></div>
<div id="pan"><button id="pResD">RES −</button><button id="pResU">RES +</button><button id="pLayD">LAYERS −</button><button id="pLayU">LAYERS +</button><button id="pTrD">TRAILS −</button><button id="pTrU">TRAILS +</button><button id="pFx">FX</button><button id="pMeter">METER</button><button id="pAud">AUDIO</button><button id="pSnd">SOUND TEST</button><button id="pClr">CLEAR</button><button id="pHide">HIDE</button></div>
<script>
(()=>{
'use strict';
/* =====================================================================================================
   FRACTURE · BOARD build, for the LG 86TR3DK-B running the piece on its own built-in computer.
   - the picture is drawn by the graphics chip: this file never reads pixels back from the canvas
     (the live piece does, constantly, which is what made the board crawl)
   - no words, no menu, no library, no songs, no export, no screen shake
   - one interactive loop of up to 12 layers at 174 BPM
   - a touch draws its first stretch of crack inside the touch event itself, before any sound work
   Settings, added to the end of the address (join with &):
     ?layers=12  looping layers kept (1-24)
     ?hands=8    fingers that can hold at once
     ?idle=75    seconds with no touch before the piece dissolves back to black
     ?ghost=20   seconds between silent ghost cracks while resting (0 = off)
     ?trails=4   how long light lingers before fading to black (1 = like the live piece on a fast phone, 8 = twice as long as 4)
     ?res=1920   canvas detail on the long edge (steps down by itself if too slow, and remembers)
     ?fs=0       don't go fullscreen on first touch
     ?fast=1     experimental low-latency canvas (try it; remove it if the picture flickers)
     ?meter=0    turn off the brightness meter (try if it stutters about 3 times a second)
     ?fx=2       glitch effects: 2 full, 1 half, 0 lines only
     ?audio=1    sound: 1 safe (default), 0 fast, 2 element, 3 off (no sound engine at all)
     ?debug=1    start with the readout + tuning buttons showing (or tap the bottom-left corner 5 times quickly)
   ===================================================================================================== */
const TAU=Math.PI*2, BPM=174, STEPS=64, STEP=60/BPM/4, LOOP=STEP*STEPS;
const QP=new URLSearchParams(location.search);
const qn=(k,d,lo,hi)=>{const v=parseFloat(QP.get(k));return isFinite(v)?Math.min(hi,Math.max(lo,v)):d;};
const LS=(k,d)=>{try{const v=localStorage.getItem('fracture-board-'+k);return v===null?d:+v;}catch(_){return d;}},LSset=(k,v)=>{try{localStorage.setItem('fracture-board-'+k,v);}catch(_){}};
let MAXV=Math.round(qn('layers',LS('layers',12),1,24)),METER=QP.has('meter')?QP.get('meter')!=='0':LS('meter',1)===1,FX=Math.round(qn('fx',LS('fx',2),0,2)),manualRes=LS('manual3',0)===1,AMODE=Math.round(qn('audio',LS('audio',1),0,3)),aEl=null,devErr=0;
let TRAILS=qn('trails',LS('trails',4),.5,40);
const HANDS=qn('hands',8,1,40),IDLE=qn('idle',75,5,36000),GHOST=qn('ghost',20,0,3600);
const FS=QP.get('fs')!=='0',DEBUG=QP.get('debug')==='1',FAST=QP.get('fast')==='1';
const $=id=>document.getElementById(id);
const cv=$('c'),dbg=$('dbg');let tune=DEBUG;if(tune)document.body.classList.add('tune');
const g=cv.getContext('2d',FAST?{alpha:false,desynchronized:true,willReadFrequently:false}:{alpha:false,willReadFrequently:false});
const RES_KEY='fracture-board-res3';
let simLong=(()=>{
  if(QP.has('res')){try{localStorage.removeItem(RES_KEY);}catch(_){}return Math.round(qn('res',1920,600,3840));}
  let s=0;try{s=+localStorage.getItem(RES_KEY)||0;}catch(_){}
  return s>=480&&s<=2560?s:1920;
})(),K=simLong/1600;
let simW=0,simH=0;
let rnd=Math.random;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const GT=4*60/BPM;                       /* growth time constant = 4 beats */
const growth=t=>1-Math.exp(-t/GT);
const rad=(p,maxR)=>maxR*(.1+.9*p);
const MAXR=()=>.85*Math.hypot(simW,simH);

/* ===== sim canvas ===== */
function calcSim(){
  const iw=innerWidth,ih=innerHeight;
  if(iw>=ih){simW=simLong;simH=Math.max(2,Math.round(simLong*ih/iw));}
  else{simH=simLong;simW=Math.max(2,Math.round(simLong*iw/ih));}
}
calcSim();
cv.width=simW;cv.height=simH;
g.fillStyle='#000';g.fillRect(0,0,simW,simH);g.imageSmoothingEnabled=false;
/* every effect that moves pixels around reads from this frame-start snapshot. drawing a canvas onto ITSELF makes the
   browser copy the entire canvas on every single call (dozens per frame = the lag), a separate source canvas does not. */
const SNc=document.createElement('canvas'),sn=SNc.getContext('2d',{alpha:false});sn.imageSmoothingEnabled=false;
function syncSnap(){if(SNc.width!==simW||SNc.height!==simH){SNc.width=simW;SNc.height=simH;}sn.drawImage(cv,0,0);snapDirty=false;}
let snapDirty=true;
/* the snapshot is only taken on frames where an effect actually uses it (a copy done by the graphics chip) */
function SN(){if(snapDirty)syncSnap();return SNc;}
syncSnap();
function resize(){
  const old=document.createElement('canvas');old.width=cv.width;old.height=cv.height;
  old.getContext('2d').drawImage(cv,0,0);
  calcSim();cv.width=simW;cv.height=simH;
  g.fillStyle='#000';g.fillRect(0,0,simW,simH);g.imageSmoothingEnabled=false;
  g.drawImage(old,0,0,simW,simH);
  syncSnap();
}
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(resize,150);});

/* ===== fracture geometry: linear, branching cracks that cross and break through each other ===== */
const world=[];let crackId=1,uidN=0,wgrid=new Map();
const GC=64,gridKey=(cx,cy)=>(cx+16)*256+(cy+16);
function gridAdd(grid,s){
  const x0=Math.floor(Math.min(s[0],s[2])/GC),x1=Math.floor(Math.max(s[0],s[2])/GC),y0=Math.floor(Math.min(s[1],s[3])/GC),y1=Math.floor(Math.max(s[1],s[3])/GC);
  for(let cx=x0;cx<=x1;cx++)for(let cy=y0;cy<=y1;cy++){const k=gridKey(cx,cy);let a=grid.get(k);if(!a){a=[];grid.set(k,a);}a.push(s);}
}
function rebuildGrid(){wgrid=new Map();for(let i=0;i<world.length;i++)gridAdd(wgrid,world[i]);}
function clearWorld(){world.length=0;wgrid=new Map();}
/* a layer's cracks live in the world while it is on canvas; a replay swaps its old cracks for its newly grown ones.
   BOARD: new cracks are just added (each layer carries a version number, so its older cracks are ignored), and the
   list is tidied up between touches instead of being rebuilt from scratch every single time a crack is grown. */
const ownerVer=new Map();let worldSweep=0;
function touchWorld(geo,owner){
  const now=performance.now()/1000,ver=(ownerVer.get(owner)||0)+1;ownerVer.set(owner,ver);
  for(const q of geo.own){const s=[q[0],q[1],q[2],q[3],q[4],now,owner,ver];world.push(s);gridAdd(wgrid,s);}
  if(world.length>16000)sweepWorld(now);
}
function sweepWorld(now){
  worldSweep=now;
  let keep=world.filter(s=>s[7]===ownerVer.get(s[6])&&now-s[5]<=14);
  if(keep.length>12000)keep=keep.slice(keep.length-12000);
  world.length=0;const live=new Set();for(let i=0;i<keep.length;i++){world.push(keep[i]);live.add(keep[i][6]);}
  ownerVer.forEach((v,k)=>{if(!live.has(k))ownerVer.delete(k);});
  rebuildGrid();
}
function findHit(x1,y1,x2,y2,id,ogrid,owner,now){
  let bt=2,bx=0,by=0,ba=0;
  const minx=Math.min(x1,x2),maxx=Math.max(x1,x2),miny=Math.min(y1,y2),maxy=Math.max(y1,y2),dx=x2-x1,dy=y2-y1;
  const test=s=>{
    const x3=s[0],y3=s[1],x4=s[2],y4=s[3];
    if((x3<minx&&x4<minx)||(x3>maxx&&x4>maxx)||(y3<miny&&y4<miny)||(y3>maxy&&y4>maxy))return;
    const ex=x4-x3,ey=y4-y3,d=dx*ey-dy*ex;
    if(d>-1e-6&&d<1e-6)return;
    const t=((x3-x1)*ey-(y3-y1)*ex)/d,u=((x3-x1)*dy-(y3-y1)*dx)/d;
    if(t>.03&&t<=1&&u>=0&&u<=1&&t<bt){bt=t;bx=x1+dx*t;by=y1+dy*t;ba=Math.atan2(ey,ex);}
  };
  /* both this fracture's own cracks and everyone else's are looked up by neighbourhood, never by scanning the whole list */
  const cx0=Math.floor(minx/GC),cx1=Math.floor(maxx/GC),cy0=Math.floor(miny/GC),cy1=Math.floor(maxy/GC);
  for(let cx=cx0;cx<=cx1;cx++)for(let cy=cy0;cy<=cy1;cy++){
    const k=gridKey(cx,cy),o=ogrid.get(k),a=wgrid.get(k);
    if(o)for(let i=0;i<o.length;i++){const s=o[i];if(s[4]!==id)test(s);}
    if(a)for(let i=0;i<a.length;i++){const s=a[i];if(s[6]!==owner&&s[7]===ownerVer.get(s[6])&&now-s[5]<=14)test(s);}
  }
  return bt<=1?{x:bx,y:by,ang:ba,d:bt*Math.hypot(dx,dy)}:null;
}
/* limit: when set, only the first stretch of every arm is grown (cheap enough to do inside a touch event).
   every arm and branch has its own random stream, so that first stretch is the same one the full build grows. */
function build(ox,oy,seed,maxR,owner,gen,limit){
  const gf=1+Math.min(gen||0,8)*.1,now=performance.now()/1000,LIM=limit||Infinity;
  const rng=mulberry32(seed),segs=[],cells=[],nodes=[],own=[],ogrid=new Map(),hyp=Math.hypot(simW,simH),MAXSEG=800;
  const child=r=>mulberry32((r()*4294967296)>>>0);
  const add=(x1,y1,x2,y2,pl,w,h,id)=>{segs.push([x1,y1,x2,y2,pl,w,h]);const o=[x1,y1,x2,y2,id,w,pl];own.push(o);gridAdd(ogrid,o);};
  function slab(trail,pl,h,rng){
    const a=trail[0],b=trail[trail.length-1],dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy)||1,s=rng()<.5?-1:1,wd=(8+rng()*52)*K,nx=-dy/L*s*wd,ny=dx/L*s*wd;
    const pts=trail.map(p=>[p[0],p[1]]);
    for(let i=trail.length-1;i>=0;i--)pts.push([trail[i][0]+nx,trail[i][1]+ny]);
    let cx=0,cy=0;pts.forEach(p=>{cx+=p[0];cy+=p[1];});
    cells.push({pts,d:pl,cx:cx/pts.length,cy:cy/pts.length,ang:Math.atan2(dy,dx),lit:rng()<.5,al:.08+rng()*.2,h:(rng()-.5)*120});
  }
  function branch(x,y,a,rem,w,h,depth,pl,fork,r){
    nodes.push({x,y,pl,hd:a,ang:a,t:0});
    const da=(r()<.5?-1:1)*(.25+r()*.95),ln=Math.max(hyp*.05,rem*(.25+r()*.4)),h2=h+(r()-.5)*40;
    walk(x,y,a+da,ln,w*.72,h2,depth+1,pl,0,fork,child(r));
  }
  function walk(x,y,a,len,w,h,depth,pl0,straight,fork,rng){
    const id=crackId++;
    let pl=pl0,run=0,cd=depth?2:0;
    const jit=straight?.012:.1,kink=straight?.01:.06,trail=[[x,y]];
    a=fwd(a);
    while(run<len&&segs.length<MAXSEG&&pl<=LIM){
      const st=(14+rng()*26)*K;
      a+=(rng()-.5)*jit;
      if(rng()<kink)a+=(rng()<.5?-1:1)*(.25+rng()*.45);
      a=fwd(a);
      const nx=x+Math.cos(a)*st,ny=y+Math.sin(a)*st,ww=Math.max(.6,w*(1-.5*run/len));
      let hit=null;
      if(cd>0)cd--;else hit=findHit(x,y,nx,ny,id,ogrid,owner,now);
      if(hit){
        add(x,y,hit.x,hit.y,pl,ww,h,id);pl+=hit.d;run+=hit.d;
        nodes.push({x:hit.x,y:hit.y,pl,hd:a,ang:hit.ang,t:1});
        if(depth>0&&rng()<.22)break;
        const off=(rng()-.5)*(14+rng()*40)*K,jx=hit.x+Math.cos(hit.ang)*off,jy=hit.y+Math.sin(hit.ang)*off;
        add(hit.x,hit.y,jx,jy,pl,ww,h,id);pl+=Math.abs(off);
        x=jx;y=jy;a+=(rng()-.5)*.6;cd=2;trail.length=0;trail.push([x,y]);
        if(depth<3&&rng()<Math.min(.9,.5*gf))branch(x,y,a,len-run,w,h,depth,pl,fork,rng);
        continue;
      }
      add(x,y,nx,ny,pl,ww,h,id);pl+=st;run+=st;x=nx;y=ny;
      trail.push([x,y]);if(trail.length>4)trail.shift();
      if(trail.length>=3&&rng()<.09)slab(trail,pl,h,rng);
      if(depth<3&&rng()<(depth?.07:.09)*fork*gf)branch(x,y,a,len-run,w,h,depth,pl,fork,rng);
      if(x<-80||y<-80||x>simW+80||y>simH+80)break;
    }
  }
  /* BOARD: every crack flows ONE way out of the touch. the fracture picks a heading (leaning toward the middle of the
     screen when the touch is near an edge, so it has room to run) and every arm, branch and kink is kept within a
     forward fan around that heading. nothing grows backwards and nothing starts anywhere but the touch or a crack
     that came from it. */
  const SPREAD=1.3;
  const dcx=simW/2-ox,dcy=simH/2-oy,edge=Math.min(1,Math.hypot(dcx,dcy)/(hyp*.5));
  const a0=edge>.12?Math.atan2(dcy,dcx)+(rng()-.5)*TAU*(1-.78*edge):rng()*TAU;
  const fwd=a=>{const d=Math.atan2(Math.sin(a-a0),Math.cos(a-a0));return d>SPREAD?a0+SPREAD:d<-SPREAD?a0-SPREAD:a;};
  const mode=rng(),Lg=()=>hyp*(.4+.55*rng()),hh=()=>(rng()-.5)*90;
  nodes.push({x:ox,y:oy,pl:0,hd:a0,ang:a0,t:0});
  if(mode<.26){            // one straight line running out of the point, forking as it goes
    walk(ox,oy,a0,Lg(),1.9,hh(),0,0,1,1.7,child(rng));
  }else if(mode<.52){      // tree: a few arms fanning forward
    const n=3+((rng()*3)|0),cone=.5+rng()*1.3;
    for(let i=0;i<n;i++)walk(ox,oy,a0+(i/(n-1)-.5)*cone+(rng()-.5)*.2,Lg(),1.8,hh(),0,0,0,1,child(rng));
  }else if(mode<.8){       // spine: one line out of the point, with straight offshoots leaving it further along
    const L1=Lg();
    walk(ox,oy,a0,L1,1.9,hh(),0,0,1,.8,child(rng));
    const n=2+((rng()*3)|0);
    for(let i=0;i<n;i++){
      const s=(.1+.7*rng())*L1,sx=ox+Math.cos(a0)*s,sy=oy+Math.sin(a0)*s,phi=(rng()<.5?-1:1)*(.35+rng()*.85);
      walk(sx,sy,a0+phi,Lg()*.75,1.6,hh(),0,s,1,.8,child(rng));
    }
  }else{                   // lightning: one trunk, heavy forking
    walk(ox,oy,a0,hyp*(.6+.4*rng()),1.9,hh(),0,0,0,2.3,child(rng));
  }
  if(!limit)touchWorld({own},owner);
  segs.sort((a,b)=>a[4]-b[4]);cells.sort((a,b)=>a.d-b.d);nodes.sort((a,b)=>a.pl-b.pl);
  {const cr=nodes.filter(n=>n.t),keep=Math.min(cr.length,36);
   for(let i=0;i<keep;i++){const n=cr[Math.floor(i*cr.length/keep)];n.fx={s:rng()<.5?-1:1,Wc:(60+rng()*160)*K,Ls:(40+rng()*110)*K,sh:(rng()<.5?-1:1)*(8+rng()*34)*K,R:(20+rng()*40)*K};}}
  let rings=nodes.map(n=>n.pl/maxR).filter(v=>v>.1&&v<1);
  if(rings.length>26){const t=[];for(let i=0;i<26;i++)t.push(rings[Math.floor(i*rings.length/26)]);rings=t;}
  return{segs,cells,nodes,rings,own};
}
/* where a crack crosses another, the older line is sheared along the new crack, plus a spark */
function crossFX(f,n){
  const q=n.fx,u=[Math.cos(n.hd),Math.sin(n.hd)],v=[-u[1],u[0]],s=q.s,Wc=q.Wc,Ls=q.Ls,sh=q.sh;
  const A=[n.x-u[0]*Wc/2,n.y-u[1]*Wc/2],B=[n.x+u[0]*Wc/2,n.y+u[1]*Wc/2];
  const P=[A,B,[B[0]+v[0]*s*Ls,B[1]+v[1]*s*Ls],[A[0]+v[0]*s*Ls,A[1]+v[1]*s*Ls]];
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  P.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});
  x0=clamp(Math.floor(x0),0,simW-1);y0=clamp(Math.floor(y0),0,simH-1);x1=clamp(Math.ceil(x1),1,simW);y1=clamp(Math.ceil(y1),1,simH);
  const bw=x1-x0,bh=y1-y0;
  if(bw>2&&bh>2){
    g.save();g.beginPath();P.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.clip();
    g.drawImage(SN(),x0,y0,bw,bh,x0+u[0]*sh,y0+u[1]*sh,bw,bh);g.restore();
  }
  g.globalCompositeOperation='lighter';
  const R=q.R,gr=g.createRadialGradient(n.x,n.y,0,n.x,n.y,R);
  gr.addColorStop(0,'hsla('+f.hue+','+(f.sat||100)+'%,70%,.5)');gr.addColorStop(1,'hsla('+f.hue+','+(f.sat||100)+'%,50%,0)');
  g.fillStyle=gr;g.fillRect(n.x-R,n.y-R,R*2,R*2);
  g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=1.2*K;g.lineCap='round';
  [n.ang,n.hd].forEach(an=>{g.beginPath();g.moveTo(n.x-Math.cos(an)*R*1.8,n.y-Math.sin(an)*R*1.8);g.lineTo(n.x+Math.cos(an)*R*1.8,n.y+Math.sin(an)*R*1.8);g.stroke();});
  g.globalCompositeOperation='source-over';
}
function reveal(f,upto,linesOnly){
  g.globalCompositeOperation='lighter';g.lineCap='round';
  const S=f.geo.segs;
  while(f.si<S.length&&S[f.si][4]<=upto){
    const s=S[f.si++],hh=(((f.hue+s[6]*.22)%360)+360)%360;
    g.strokeStyle='hsla('+hh+','+(f.sat||100)+'%,58%,.26)';g.lineWidth=s[5]*3.4*K;
    g.beginPath();g.moveTo(s[0],s[1]);g.lineTo(s[2],s[3]);g.stroke();
    g.strokeStyle='hsla('+hh+','+(f.sat||100)+'%,78%,.85)';g.lineWidth=s[5]*K;g.stroke();
  }
  const C=f.geo.cells;
  while(f.ci<C.length&&C[f.ci].d<=upto){
    const c=C[f.ci++];
    if(c.lit){
      g.fillStyle='hsla('+((((f.hue+c.h*.22)%360)+360)%360)+','+(f.sat||100)+'%,55%,'+c.al+')';
      g.beginPath();c.pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill();
    }
  }
  g.globalCompositeOperation='source-over';
  const N=f.geo.nodes;
  while(f.ni<N.length&&N[f.ni].pl<=upto){const n=N[f.ni++];if(n.fx&&!linesOnly)crossFX(f,n);}
}
/* glitches run at points along the cracks, not around the press point */
function sub(f){
  const c=Object.create(f);
  if(f.si>0){
    const k=rnd()<.55?Math.max(0,f.si-1-((rnd()*Math.min(f.si,60))|0)):((rnd()*f.si)|0),s=f.geo.segs[k];
    c.x=(s[0]+s[2])/2;c.y=(s[1]+s[3])/2;c.u=k/f.geo.segs.length;
  }
  return c;
}
const localR=p=>(90+380*p)*K*(.6+rnd()*.8);

/* ===== glitches ===== */
function pickRegion(f,r,sc,maxS){

const FAM={kick:[0,100],snare:[12,100],hat:[26,100],anvil:[38,100],
  acid:[318,100],thud:[300,100],growl:[284,100],grind:[268,100],
  lead:[188,100],siren:[170,100],riser:[150,100],clang:[128,100],
  glass:[200,30],noise:[215,18]};
const famHue=k=>{const b=(FAM[k]||[0])[0];return((b+((rnd()*12-6)|0))%360+360)%360;};
const famSat=k=>(FAM[k]||[0,100])[1];
function pitchFrom(y01){
  const idx=Math.floor((1-y01)*18.99),s=SC[idx%7]+12*Math.floor(idx/7),cents=(rnd()-.5)*50;
  return 55*Math.pow(2,(s+cents/100)/12);
}
const INST=Object.keys(V);let lastInst='';
function pickInst(){
  const used={};
  events.forEach(e=>{used[e.inst]=(used[e.inst]||0)+1;});
  held.forEach(fr=>{used[fr.inst]=(used[fr.inst]||0)+1;});
  let mn=1e9;INST.forEach(k=>{mn=Math.min(mn,used[k]||0);});
  let list=INST.filter(k=>(used[k]||0)===mn&&k!==lastInst);
  if(!list.length)list=INST.filter(k=>(used[k]||0)===mn);
  return lastInst=list[(rnd()*list.length)|0];
}

/* ===== loop ===== */
let loopT0=null,nextT=0,nextStep=0,loopNo=0;
const events=[],vq=[];
/* voices are fed to the audio engine in small chunks (about half a second ahead) instead of all at once, so a long
   hold or a fast roll never dumps hundreds of nodes onto the page in a single moment */
const jobs=[];
function playEvent(ev,t){
  if(AMODE===3)return;
  curLayer=ev.lg||null;
  try{
  const h=V[ev.inst](t,ev.f);
  const job={h,t,ev,i:1,n:Math.floor(ev.dur/STEP),ring:ev.ringT.map((rt,k)=>[rt,k]).filter(r=>r[0]<ev.dur).sort((a,b)=>a[0]-b[0]),ri:0,done:false};
  advance(job,AC.currentTime);
  if(!job.done)jobs.push(job);
  }finally{curLayer=null;}
}
function advance(job,now){
  const h=job.h,t=job.t,ev=job.ev,hz=now+.5;
  while(job.i<=job.n&&t+job.i*STEP<hz){const tt=job.i*STEP;h.upd(growth(tt),t+tt);job.i++;}
  while(job.ri<job.ring.length&&t+job.ring[job.ri][0]<hz){tickSnd(t+job.ring[job.ri][0],job.ring[job.ri][1]%9);job.ri++;}
  if(job.i>job.n&&job.ri>=job.ring.length&&t+ev.dur<hz+.5){
    const te=t+ev.dur+.002;h.end(te,ev.pEnd);impact(te,ev.pEnd);if(ev.stut)stutter(te);job.done=true;
  }
}
function runJobs(now){
  for(let i=jobs.length-1;i>=0;i--){const j=jobs[i];curLayer=j.ev.lg||null;try{advance(j,now);}catch(e){j.done=true;console.warn(e);}curLayer=null;if(j.done)jobs.splice(i,1);}
}
let metOn=false,mNext=0,mBeat=0;const mvq=[],BEAT=4*STEP;
function click(t,acc,first){
  const o=AC.createOscillator(),a=AC.createGain();o.type='square';o.frequency.value=first?2100:acc?1568:1046;
  a.gain.setValueAtTime(0,t);a.gain.linearRampToValueAtTime(first?.3:acc?.22:.13,t+.001);a.gain.exponentialRampToValueAtTime(.0004,t+.045);
  o.connect(a);a.connect(master);o.start(t);o.stop(t+.06);   /* straight to master: never in the MP4 */
}
const LOOKAHEAD=.4;
function sched(){
  if(!AC||loopT0===null)return;
  const now=AC.currentTime;
  if(mNext<now-1.5){const b=Math.ceil((now-loopT0)/BEAT);mNext=loopT0+b*BEAT;mBeat=((b%16)+16)%16;}
  while(mNext<now+LOOKAHEAD){
    const acc=mBeat%4===0;
    if(metOn){try{click(Math.max(mNext,now+.002),acc,mBeat===0);}catch(e){}}
    mvq.push({t:mNext,a:acc,f:mBeat===0});mNext+=BEAT;mBeat=(mBeat+1)%16;
  }
  if(nextT<now-1.5){          /* tab slept or the page froze for ages: jump to now instead of replaying a burst of stale steps */
    const g=Math.ceil((now-loopT0)/STEP);nextT=loopT0+g*STEP;nextStep=((g%STEPS)+STEPS)%STEPS;loopNo=Math.floor(g/STEPS);
  }
  while(nextT<now+LOOKAHEAD){
    /* a step that is late (the page was busy drawing) still plays, just a touch late - it is never thrown away */
    for(const ev of events){
      const xs=0;
      if(ev.step===nextStep&&loopNo>=Math.max(ev.startLoop,xs)){
        const tt=Math.max(nextT,now+.005);
        try{playEvent(ev,tt);}catch(e){console.warn(e);}
        vq.push({t:tt,ev,vis:ev.vis!==false});
      }
    }
    nextT+=STEP;
    if(++nextStep>=STEPS){nextStep=0;loopNo++;}
  }
  runJobs(now);
}
setInterval(sched,20);
function recordEvent(f,hold){
  if(loopT0===null||!AC)return;
  const dur=Math.min(LOOP-STEP,Math.max(STEP,Math.round(hold/STEP)*STEP));
  const s=Math.round((f.pressT-loopT0)/STEP),step=s%STEPS,T=loopT0+s*STEP;
  const startLoop=Math.floor(s/STEPS)+(T>AC.currentTime+.2?0:1),pEnd=growth(dur);
  const ringT=f.rings.map(rv=>{const p=(rv-.1)/.9;return p>0&&p<pEnd?-GT*Math.log(1-p):Infinity;});
  events.push({inst:f.inst,f:f.f,x:f.x/simW,y:f.y/simH,seed:f.seed,hue:f.hue,uid:f.uid,gen:0,dur,hold,geo:f.geo,ops:f.ops,sw:simW,sh:simH,step,startLoop,ringT,pEnd,stut:pEnd>.3&&rnd()<.4});
  if(events.length>MAXV)events.shift();
}

/* ===== fractures ===== */
let frs=[],budget=3;
const held=new Map();
/* every effect a fracture makes is stored as an op (type, place, size, own rng seed),
   so each loop replay re-runs the exact same effects the fracture had when it was made */
function runOp(f,op){
  const old=rnd;rnd=mulberry32(op.s);
  try{
    if(op.k==='rev')reveal(f,op.r);
    else if(op.k==='fl')flash(f,op.r,op.q);
    else{
      const c=Object.create(f);c.x=op.x;c.y=op.y;
      /* a replay's cracks have re-grown, so put the effect on the same part of the NEW crack web */
      if(!f.live&&op.u!==undefined&&f.geo.segs.length){const G=f.geo.segs,sg=G[Math.min(G.length-1,Math.floor(op.u*G.length))];c.x=(sg[0]+sg[2])/2;c.y=(sg[1]+sg[3])/2;}
      if(op.k==='g'){glitch(c,op.n,op.r,op.q);if(!f.ghost){try{audioFX(op.n,op.q);}catch(e){console.warn('fx',e);}}}else lightBurst(c,op.r,op.q);
    }
  }finally{rnd=old;}
}
/* replays share a per-frame effect budget: cracks always draw, but when many layers land at once on a slow
   device the extra glitch effects are skipped instead of piling up and freezing the page */
let rbudget=12;
function replayOp(f,op){
  if(op.k==='g'||op.k==='l'){if(rbudget<=0)return;rbudget-=op.k==='g'?1:.5;}
  runOp(f,op);
}
function burst(f,p,th){
  const r=rad(p,f.maxR)*1.25,k=.35+.65*p,n=3+Math.round(4*p);
  f.put({t:th,k:'rev',r});
  for(let i=0;i<n;i++)f.op(th,'g',f.pool[(i+f.bc++)%f.pool.length],localR(p),k);
  f.op(th,'l',null,localR(p),k);f.op(th,'l',null,localR(p),k);
  f.put({t:th,k:'fl',r:r*.4,q:k});
}
class Fr{
  constructor(o){
    Object.assign(this,o);

    /* a touch only grows the first stretch of its cracks (fast); finish() grows the rest a moment later */
    this.partial=!!this.live&&!o.geo;
    this.geo=o.geo||build(this.x,this.y,this.seed,this.maxR,this.uid,0,this.partial?rad(0,this.maxR):0);this.rings=this.geo.rings;
    this.ops=o.ops||[];this.oi=0;this.ts=(o.hold&&o.dur)?o.hold/o.dur:1;
    this.t0=performance.now()/1000;this.si=0;this.ci=0;this.ni=0;this.ri=0;this.p=0;this.lastTick=0;this.lastUpd=0;this.bc=0;this.done=false;this.released=false;
    if(this.live){
      this.pool=PRIMARY[this.inst].slice();
    }
    flash(this,40*K,.5);
  }
  finish(){
    if(!this.partial)return;this.partial=false;
    const lim=rad(0,this.maxR),geo=build(this.x,this.y,this.seed,this.maxR,this.uid,0),r=rad(this.p||0,this.maxR)/this.maxR;
    let i=0;while(i<geo.segs.length&&geo.segs[i][4]<=lim)i++;this.si=i;      /* that first stretch is already on screen */
    i=0;while(i<geo.cells.length&&geo.cells[i].d<=lim)i++;this.ci=i;
    i=0;while(i<geo.nodes.length&&geo.nodes[i].pl<=lim)i++;this.ni=i;
    i=0;while(i<geo.rings.length&&geo.rings[i]<=r)i++;this.ri=i;
    this.geo=geo;this.rings=geo.rings;
  }
  put(op){op.s=(Math.random()*1e9)|0;this.ops.push(op);runOp(this,op);}
  op(t,k,n,r,q){const c=sub(this);this.put({t,k,n,x:c.x,y:c.y,u:c.u,r,q});}
  step(now){
    if(this.done)return;
    const t=now-this.t0;
    if(!this.live){
      const te=t*this.ts,p=growth(Math.min(te,this.hold)),O=this.ops;
      this.p=p;reveal(this,rad(p,this.maxR));
      while(this.oi<O.length&&O[this.oi].t<=te)replayOp(this,O[this.oi++]);
      if(te>=this.hold){
        while(this.oi<O.length)replayOp(this,O[this.oi++]);
        this.done=true;this.released=true;
      }
      return;
    }
    const p=growth(t);

    const r=rad(p,this.maxR);

      if(this.voice&&now-this.lastUpd>STEP*.5){this.lastUpd=now;this.voice.upd(p,AC.currentTime+.03);}
      while(this.ri<this.rings.length&&r/this.maxR>=this.rings[this.ri]){tickSnd(AC.currentTime+.003,this.ri%9);this.ri++;}
    }
    let fire;
    if(AC&&loopT0!==null){const si=Math.floor((AC.currentTime-loopT0)/STEP);fire=si!==this.lastSi&&si%(p<.35?2:1)===0;if(fire&&budget>0)this.lastSi=si;}
    else fire=now-this.lastTick>Math.max(.07,.17-.09*p);
    if(fire&&budget>0){
      this.lastTick=now;budget--;
      const lr=localR(p);
      this.op(t,'g',this.pool[(rnd()*this.pool.length)|0],lr,.12+.7*p);
      this.op(t,'l',null,lr,p*.6);
    }
  }
  release(){

      const t=AC.currentTime;

    }
  }
}
/* if the window size changed since a fracture was made, scale its stored geometry and ops */
function rescale(ev){      /* window size changed: only the stored effect sizes need scaling, the cracks are re-grown anyway */
  const sx=simW/ev.sw,sy=simH/ev.sh,sa=Math.sqrt(sx*sy);
  ev.ops=ev.ops.map(o=>{const q={...o};if(q.x!==undefined){q.x*=sx;q.y*=sy;}q.r*=sa;return q;});
  ev.sw=simW;ev.sh=simH;
}
/* every loop a layer comes back with the SAME seed, effects and sound, but its cracks are grown again from scratch:
   they break through whatever fractures are on the canvas now, including ones made after it, and each pass is a
   little denser. so the longer the loop runs, the more crossed and fractured the picture gets, even with no input. */
function spawnReplay(ev){
  if(ev.sw!==simW||ev.sh!==simH)rescale(ev);
  ev.gen=(ev.gen||0)+1;
  const geo=build(ev.x*simW,ev.y*simH,ev.seed,MAXR(),ev.uid,ev.gen);
  ev.geo=geo;
  frs.push(new Fr({x:ev.x*simW,y:ev.y*simH,seed:ev.seed,hue:ev.hue,sat:famSat(ev.inst),inst:ev.inst,live:false,dur:ev.dur,hold:ev.hold,f:ev.f,pressT:0,geo,ops:ev.ops,uid:ev.uid}));
}

/* ===== fade, done by the graphics chip =====
   two full-screen fills, about 15 times a second:
   1) a faint black wash takes a fraction off everything (stronger when more layers are playing, so it never whites out)
   2) a 'difference' fill with the darkest possible grey takes 1 off every colour value, so trails really reach black
      (pure black flickers between 0 and 1 out of 255, which no screen shows) */
let fadeAcc=0,govAcc=0,lumAvg=0,whiteFrac=0,lumT=0;
/* brightness meter: the graphics chip shrinks the picture to a thumbnail and only that thumbnail is read back
   (about 3 times a second). it tells the fade how hard to work so the piece never whites out. ?meter=0 turns it off. */
const MW=384,MH=216,Mc=document.createElement('canvas');Mc.width=MW;Mc.height=MH;
const mg=Mc.getContext('2d',{alpha:false,willReadFrequently:false});
function measure(){
  mg.drawImage(cv,0,0,MW,MH);
  const d=mg.getImageData(0,0,MW,MH).data;let s=0,w=0,n=0;
  for(let i=0;i<d.length;i+=16){const a=d[i],b=d[i+1],c=d[i+2];s+=a+b+c;if((a<b?(a<c?a:c):(b<c?b:c))>150)w++;n++;}
  lumAvg=s/(3*n);whiteFrac=w/n;
}
/* two separate jobs:
   - the slow, steady fade that lets fractures pile up on each other. TRAILS sets how long light lingers (tuning panel).
   - the brightness governor, which only acts when the meter says the picture is getting too bright, and always acts fast. */
function fadeBase(){
  g.globalAlpha=1;g.globalCompositeOperation='source-over';g.fillStyle='rgba(0,0,0,.0079)';g.fillRect(0,0,simW,simH);
  g.globalCompositeOperation='difference';g.fillStyle='#010101';g.fillRect(0,0,simW,simH);
  g.globalCompositeOperation='source-over';
}
function fadeGovern(){
  let a=0;
  if(METER){
    a=lumAvg>50?1/16:lumAvg>34?1/32:lumAvg>24?1/64:0;          /* same steps the live piece uses */
    if(lumAvg>62)a+=.14;else if(lumAvg>46)a+=.06;              /* whole-frame brightness governor */
    a+=Math.min(.12,whiteFrac*.7);                              /* pull whited-out areas back */
  }else{const n=events.length+held.size;a=n>9?1/14:n>6?1/24:n>3?1/48:0;}
  if(a<=0)return;
  g.globalAlpha=1;g.globalCompositeOperation='source-over';g.fillStyle='rgba(0,0,0,'+Math.min(.6,a).toFixed(4)+')';g.fillRect(0,0,simW,simH);
}

/* ===== input: the picture comes first ===== */
let pressMs=0,buildMs=0;
function begin(e){
  if(held.size>=HANDS)return;             /* a crowd (or a sleeve on the touch frame) can't pile up endless voices */
  const t0=performance.now();
  resting=false;
  const x=clamp(e.clientX/innerWidth*simW,0,simW-1),y=clamp(e.clientY/innerHeight*simH,0,simH-1);
  let t=0;
  if(AC){
    if(AC.state!=='running'){try{AC.resume();}catch(_){}}
    t=AC.currentTime;
    if(loopT0===null){loopT0=t;nextT=t;nextStep=0;loopNo=0;mNext=t;mBeat=0;mvq.length=0;}
  }
  const inst=pickInst(),f=pitchFrom(y/simH);
  const fr=new Fr({uid:++uidN,x,y,seed:(rnd()*1e9)|0,hue:famHue(inst),sat:famSat(inst),inst,live:true,f,voice:null,pressT:t});
  held.set(e.pointerId,fr);frs.push(fr);
  try{reveal(fr,rad(0,fr.maxR),true);}catch(err){console.warn(err);}   /* draw the first stretch of crack right now, inside the touch event; effects follow on the next frame */
  pressMs=Math.max(pressMs*.9,performance.now()-t0);
  /* the rest of the crack web is grown only after that first stretch has reached the screen */
  requestAnimationFrame(()=>setTimeout(()=>{const b0=performance.now();try{fr.finish();}catch(err){console.warn(err);}buildMs=Math.max(buildMs*.9,performance.now()-b0);},0));
  /* the sound is built straight after, in its own turn, so it can never delay the line */
  setTimeout(()=>{
    try{
      initAudio();if(!AC||AMODE===3)return;
      const v=V[inst](Math.max(t+.003,AC.currentTime),f);
      if(fr.released)v.end(AC.currentTime+.02,fr.p||.05);else fr.voice=v;
    }catch(err){console.warn(err);}
  },0);
}
function end(e){poke();const fr=held.get(e.pointerId);if(fr){held.delete(e.pointerId);fr.release();}}
let cTaps=[];
function cornerTap(e){
  const z=Math.min(innerWidth,innerHeight)*.16;if(e.clientX>z||e.clientY<innerHeight-z)return;
  const t=performance.now();cTaps=cTaps.filter(x=>t-x<3000);cTaps.push(t);
  if(cTaps.length>=5){cTaps=[];setTune(!tune);}
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();poke();cornerTap(e);begin(e);try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);
/* the board must never zoom, scroll, or pop a browser menu when the public touches it */
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
['gesturestart','gesturechange','dblclick','contextmenu','selectstart','dragstart'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
addEventListener('wheel',e=>{if(e.ctrlKey)e.preventDefault();},{passive:false});

/* ===== keep the screen awake + fullscreen, idle dissolve, resting ghosts ===== */
let wl=null;
function keepAwake(){
  try{if(navigator.wakeLock&&!wl&&!document.hidden)navigator.wakeLock.request('screen').then(l=>{wl=l;l.addEventListener('release',()=>{wl=null;});}).catch(()=>{});}catch(_){}
}
addEventListener('pointerup',()=>{
  keepAwake();
  if(FS&&!document.fullscreenElement&&document.documentElement.requestFullscreen){
    try{const p=document.documentElement.requestFullscreen({navigationUI:'hide'});if(p&&p.catch)p.catch(()=>{});}catch(_){}
  }
},{capture:true,passive:true});
document.addEventListener('visibilitychange',keepAwake);
let lastTouch=performance.now()/1000,lastDrop=0,lastActive=0,resting=true,nextGhost=lastTouch+6;
function poke(){lastTouch=performance.now()/1000;}
function rest(now){
  resting=true;loopT0=null;vq.length=0;mvq.length=0;clearWorld();
  g.globalAlpha=1;g.globalCompositeOperation='source-over';g.fillStyle='#000';g.fillRect(0,0,simW,simH);
  nextGhost=now+4+rnd()*6;
}
/* a silent crack that grows and fades by itself while the wall is resting, so the screen is never just dead black */
function ghost(now){
  const inst=INST[(rnd()*INST.length)|0],pool=PRIMARY[inst],hold=STEP*8*(1+((rnd()*3)|0)),ops=[];
  for(let t=STEP*2;t<hold;t+=STEP*2){const p=growth(t);ops.push({t,k:'g',n:pool[(rnd()*pool.length)|0],x:0,y:0,u:rnd(),r:localR(p),q:.12+.6*p,s:(rnd()*1e9)|0});}
  frs.push(new Fr({uid:++uidN,x:simW*(.12+.76*rnd()),y:simH*(.15+.7*rnd()),seed:(rnd()*1e9)|0,hue:famHue(inst),sat:famSat(inst),inst,live:false,ghost:true,dur:hold,hold,f:0,pressT:0,ops}));
  nextGhost=now+GHOST*(.7+.6*rnd());
}
function idleTick(now){
  /* something leaning on the screen (a bag, a sleeve): let go of any touch held longer than 20 s */
  if(held.size)held.forEach((fr,id)=>{if(now-fr.t0>20){held.delete(id);fr.release();}});
  if(held.size||events.length||(frs.length&&!resting))lastActive=now;
  if(held.size)return;
  const idle=now-lastTouch;
  if(events.length){
    /* nobody has touched for a while: layers leave a few at a time, once per loop, until the wall is quiet */
    if(idle>IDLE&&now-lastDrop>=LOOP){lastDrop=now;events.splice(0,Math.max(1,Math.ceil(events.length/4)));}
    return;
  }
  if(!resting){if(now-lastActive>(METER&&lumAvg<1.2?4:20+TRAILS*8))rest(now);return;}     /* rest once the picture has faded to black */
  if(GHOST>0&&now>nextGhost&&!frs.length)ghost(now);
}
/* a plugged-in keyboard: C clears everything, M mutes */
function clearAll(){
  held.forEach(fr=>{if(AC&&fr.voice)try{fr.voice.end(AC.currentTime,.3);}catch(_){}});
  held.clear();events.length=0;frs=[];
  jobs.forEach(j=>{try{j.h.end(AC?AC.currentTime:0,.3);}catch(_){}});jobs.length=0;
  if(AC&&gate){gate.gain.cancelScheduledValues(AC.currentTime);gate.gain.setValueAtTime(1,AC.currentTime);}
  rest(performance.now()/1000);
}
addEventListener('keydown',e=>{
  const k=(e.key||'').toLowerCase();
  if(k==='c')clearAll();
  else if(k==='m'){soundOn=!soundOn;if(AC)master.gain.setTargetAtTime(soundOn?.9:0,AC.currentTime,.03);}
});

/* ===== main loop ===== */
/* if the page stays under ~19 frames a second for 1.5 s, the canvas drops a step in detail (1920 -> 1600 -> 1280 -> 960 -> 640), remembered.
   once RES is set by hand in the tuning panel, it stays where it was put. */
let slowSince=0;
function setRes(v){simLong=v;K=simLong/1600;try{localStorage.setItem(RES_KEY,simLong);}catch(_){}clearWorld();frs=frs.filter(f=>f.live);resize();}
function qualityCheck(now){
  if(manualRes||fms<52||simLong<=640){slowSince=0;return;}
  if(!slowSince){slowSince=now;return;}
  if(now-slowSince<1.5)return;
  slowSince=0;setRes(simLong>1600?1600:simLong>1280?1280:simLong>960?960:640);
}
let lastFrameT=0,fms=16,lastResume=0,worst=0,jsMs=0,dbgN=0;
/* ===== sound watchdog: listens to the output twice a second and repairs it if it has gone quiet when it shouldn't be =====
   1) values that hold the whole mix down (gate, duck, sweep filters) are snapped back to open
   2) if that doesn't bring it back, the sound engine is rebuilt and the loop carries on in time */
let an=null,anBuf=null,outPk=0,quietSince=0,softAt=0,wdT=0,softFix=0,hardFix=0,fixWhy='',lastRebuild=-99,notRunSince=0,gestured=false,needRebuild=false;
function level(){
  if(!AC||!master)return 0;
  try{
    if(!an||an.context!==AC){an=AC.createAnalyser();an.fftSize=512;anBuf=new Float32Array(512);master.connect(an);}
    an.getFloatTimeDomainData(anBuf);let m=0;
    for(let i=0;i<512;i++){const v=anBuf[i];if(v!==v||v>1e6||v<-1e6)return NaN;const a=v<0?-v:v;if(a>m)m=a;}
    return m;
  }catch(_){return 0;}
}
function softReset(){
  const t=AC.currentTime;
  [[gate.gain,1],[duck.gain,1],[mf.frequency,20000],[mf.Q,.7],[hf.frequency,20],[hf.Q,.7]].forEach(pv=>{try{pv[0].cancelScheduledValues(t);pv[0].setValueAtTime(pv[1],t);}catch(_){}});
  gateBusy=0;softFix++;fixWhy='reopened';
}
function rebuildAudio(why){
  const old=AC,hadLoop=loopT0!==null;let phase=0;
  if(old&&hadLoop)phase=(((old.currentTime-loopT0)%LOOP)+LOOP)%LOOP;
  try{if(old){const p=old.close();if(p&&p.catch)p.catch(()=>{});}}catch(_){}
  AC=null;audioDead=false;an=null;jobs.length=0;vq.length=0;mvq.length=0;gateBusy=0;lastStut=-9;for(const k in fxLast)delete fxLast[k];
  initAudio();if(!AC)return;
  try{AC.resume();}catch(_){}
  held.forEach(fr=>{fr.voice=null;fr.pressT=AC.currentTime;});
  if(hadLoop){loopT0=AC.currentTime-phase;nextT=-10;mNext=-10;events.forEach(e=>{e.startLoop=0;});}
  hardFix++;fixWhy=why;lastRebuild=performance.now()/1000;quietSince=0;softAt=0;notRunSince=0;
}
function watchdog(now){
  if(AMODE===3){outPk=0;return;}
  const lv=level();outPk=Math.max(outPk*.6,lv===lv?lv:0);
  if(!AC||!soundOn)return;
  if(AC.state!=='running'){
    if(!notRunSince)notRunSince=now;
    if(gestured&&now-notRunSince>4)needRebuild=true;      /* stuck asleep: rebuilt on the next touch, where the browser allows it */
    return;
  }
  notRunSince=0;
  if(lv!==lv){if(now-lastRebuild>10)rebuildAudio('bad signal');return;}
  const expect=held.size>0||(events.length>0&&loopT0!==null);
  if(lv>.0005||!expect){quietSince=0;softAt=0;return;}
  if(!quietSince)quietSince=now;
  const lim=held.size?2.5:LOOP+1.5;
  if(!softAt){if(now-quietSince>lim){softReset();softAt=now;}}
  else if(now-softAt>lim&&now-lastRebuild>30)rebuildAudio('silent');
}
addEventListener('pointerup',()=>{gestured=true;if(needRebuild){needRebuild=false;try{rebuildAudio('asleep');}catch(_){}}},{capture:true,passive:true});
const UA=((navigator.userAgent.match(/(Chrome|Firefox|Version)\/[\d.]+/)||[''])[0])+' '+((navigator.userAgent.match(/Android [\d.]+/)||[''])[0]);
/* ===== hidden tuning panel: 5 quick taps in the bottom-left corner. everything set here is remembered on this screen ===== */
let tuneAt=0;
function setTune(on){tune=on;tuneAt=performance.now();document.body.classList.toggle('tune',on);}
const RSTEPS=[480,640,800,960,1280,1600,1920,2560];
function stepRes(d){let i=0;RSTEPS.forEach((v,j)=>{if(Math.abs(v-simLong)<Math.abs(RSTEPS[i]-simLong))i=j;});i=clamp(i+d,0,RSTEPS.length-1);manualRes=true;LSset('manual3',1);setRes(RSTEPS[i]);}
function stepLayers(d){MAXV=clamp(MAXV+d,1,24);LSset('layers',MAXV);while(events.length>MAXV)events.shift();}
function soundTest(){
  /* rebuild the sound engine inside this tap, then play a plain beep straight to the speakers (it skips the whole effects chain) */
  rebuildAudio('test');if(!AC||AMODE===3)return;
  const o=AC.createOscillator(),a=AC.createGain(),t=AC.currentTime+.05;o.frequency.value=660;a.gain.setValueAtTime(.25,t);a.gain.setTargetAtTime(0,t+.35,.05);
  o.connect(a);outTo(a);o.start(t);o.stop(t+.7);
}
/* buttons ignore the first second after the panel opens: the finger that opened it is still lifting off */
const tap=(id,fn)=>{$(id).addEventListener('click',e=>{e.stopPropagation();poke();if(performance.now()-tuneAt<1000)return;try{fn();}catch(err){console.warn(err);}});};
tap('pResD',()=>stepRes(-1));tap('pResU',()=>stepRes(1));tap('pLayD',()=>stepLayers(-1));tap('pLayU',()=>stepLayers(1));
tap('pTrD',()=>{TRAILS=Math.max(.5,+(TRAILS/1.5).toFixed(2));LSset('trails',TRAILS);});tap('pTrU',()=>{TRAILS=Math.min(40,+(TRAILS*1.5).toFixed(2));LSset('trails',TRAILS);});
tap('pFx',()=>{FX=(FX+2)%3;LSset('fx',FX);});tap('pMeter',()=>{METER=!METER;LSset('meter',METER?1:0);});
tap('pSnd',soundTest);tap('pAud',()=>{AMODE=({1:2,2:0,0:3,3:1})[AMODE];LSset('audio',AMODE);soundTest();});tap('pClr',()=>clearAll());tap('pHide',()=>setTune(false));
function frame(){
  requestAnimationFrame(frame);
  try{
  const now=performance.now()/1000,j0=performance.now();
  if(AC&&AC.state!=='running'&&now-lastResume>1){lastResume=now;try{AC.resume();}catch(_){}}
  sched();
  const dt=lastFrameT?now-lastFrameT:0;
  if(lastFrameT){fms=fms*.9+dt*1000*.1;worst=Math.max(worst*.985,dt*1000);}lastFrameT=now;
  budget=fms>62?1:fms>45?2:3;                     /* thresholds sit below 30 fps: this board's browser tops out there */
  rbudget=fms>66?2:fms>50?4:fms>40?7:10;
  if(FX<2){budget=FX?Math.min(budget,1):0;rbudget=FX?Math.min(rbudget,3):0;}
  qualityCheck(now);
  idleTick(now);
  if(now-worldSweep>5&&!held.size&&world.length){sweepWorld(now);}
  if(now-wdT>.5){wdT=now;try{watchdog(now);}catch(_){}}
  if(AC){
    const ac=AC.currentTime;
    while(mvq.length&&mvq[0].t<=ac)mvq.shift();
    /* at most one layer is re-grown per frame, so layers that land on the same beat can't stall a frame (and a waiting touch) */
    const lat=Math.min(.35,AC.outputLatency||AC.baseLatency||0);     /* show a layer when its sound actually reaches the speakers */
    let nb=0;
    while(vq.length&&vq[0].t+lat<=ac&&nb<1){const e=vq.shift();if(ac-e.t<.9&&e.vis){spawnReplay(e.ev);nb++;}}
  }
  fadeAcc+=Math.min(dt,.25);
  if(METER&&now-lumT>.3&&(!resting||frs.length)){lumT=now;try{measure();}catch(_){}}
  govAcc+=Math.min(dt,.25);
  const fEvery=TRAILS/15,live=!resting||frs.length;
  if(fadeAcc>=fEvery){fadeAcc=Math.min(fadeAcc-fEvery,fEvery);if(live)fadeBase();}
  if(govAcc>=1/15){govAcc=Math.min(govAcc-1/15,1/15);if(live)fadeGovern();}
  snapDirty=true;
  for(let i=0;i<frs.length;i++){try{frs[i].step(now);}catch(e){frs[i].done=true;console.warn('fracture error',e);}}
  if(frs.some(f=>f.done))frs=frs.filter(f=>!f.done);
  if(tune){
    jsMs=jsMs*.9+(performance.now()-j0)*.1;
    if(++dbgN%6===0){
      dbg.textContent='B7  '+Math.round(1000/fms)+' fps  worst '+Math.round(worst)+'ms  js '+jsMs.toFixed(1)+'ms  press '+pressMs.toFixed(0)+'ms  build '+buildMs.toFixed(0)+'ms'
        +'\nres '+simLong+(manualRes?' (set)':' (auto)')+'  layers '+events.length+'/'+MAXV+'  trails '+TRAILS+'  fx '+FX+'  meter '+(METER?'on':'off')+'  lum '+lumAvg.toFixed(0)
        +'\naudio '+(AC?AC.state+' '+AC.sampleRate+'Hz':audioDead?'FAILED':'none')+'  '+['fast','safe','element','OFF'][AMODE]+' '+Math.round(1000*((AC&&(AC.outputLatency||AC.baseLatency))||0))+'ms  out '+outPk.toFixed(2)+(soundOn?'':'  MUTED')+'  fixes '+softFix+'/'+hardFix+(fixWhy?' '+fixWhy:'')+(devErr?'  DEVICE ERRORS '+devErr:'')
        +'\nscreen '+innerWidth+'x'+innerHeight+' @'+(+devicePixelRatio.toFixed(2))+'  '+UA;
    }
  }
  }catch(e){console.warn('frame error',e);}
}
requestAnimationFrame(frame);
/* build the sound engine shortly after load instead of on the first touch, so the first touch doesn't freeze */
setTimeout(()=>{try{initAudio();}catch(_){}},1200);
/* offline: once this page has loaded with internet a single time, it keeps working with none */
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(()=>{});}
})();
</script>
